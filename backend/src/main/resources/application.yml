spring:
  application:
    name: teamflow-backend
  config:
    import: optional:file:../.env[.properties]

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/teamflow}
    username: ${DB_USERNAME:teamflow}
    password: ${DB_PASSWORD:teamflow_dev_password}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

app:
  name: TeamFlow API
  version: 0.1.0
  environment: development
  jwt:
    secret: ${JWT_SECRET}
    access-token-minutes: ${JWT_ACCESS_MINUTE:15}
    refresh-token-days: ${JWT_REFRESH_DAYS:7}
  cookie:
    secure: ${COOKIE_SECURE:false} 
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operation-sorter: method
  api-docs:
    path: /v3/api-docs
logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-........}] %logger{25} - %msg%n"
